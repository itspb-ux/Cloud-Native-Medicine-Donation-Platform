services:

  postgres:
    image: postgres:17-alpine
    container_name: medicine-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: medicine_donation

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  app:
    build: .

    container_name: medicine-app

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    ports:
      - "3000:3000"

    environment:
      PORT: 3000
      JWT_SECRET: docker-secret
      JWT_EXPIRES_IN: 24h
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/medicine_donation
      EXPIRY_CHECK_INTERVAL_MS: 3600000

volumes:
  postgres_data: